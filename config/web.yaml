# GeoMCP HTTP、Tool 调度、Session 与 Snapshot 部署配置。
http:
  # warning 与 map HTTP services 共用的内部 listener host。
  listen_host: "127.0.0.1"
  warning:
    # Browser 固定同源 POST /browser-warnings，由部署层转发到此内部端口。
    port: 23446
    # 单条 warning payload 很小；解析 JSON 前先限制累计请求体字节数。
    max_body_bytes: 4096
    # 所有 Interactive sessions 共用该通道；限流只保护服务，不替代 Browser 页面内去重。
    rate_limit_window_seconds: 60
    max_requests_per_window: 600
  map:
    # 正式 Session、公开 Snapshot 与内部一次性 Snapshot route 共用此端口。
    port: 23336
    # 对外返回的固定 HTTP(S) origin；正式部署时替换为反向代理公开地址。
    public_origin: "https://skirt-daisy-supporting-travesti.trycloudflare.com"
  mcp:
    # 内部 MCP listener；公网 HTTPS 与 Bearer token 由前置反向代理提供。
    port: 23337
    # 解析 JSON 前限制单个 MCP POST 请求体的字节数。
    max_body_bytes: 4194304
    # 只限制 HTTP 请求头和请求体的接收时间；工具执行使用 tool_execution.timeout_seconds。
    request_receive_timeout_seconds: 10
    # 只清理空闲的 MCP transport session，不改变地图 Session TTL 或归档。
    session_idle_timeout_seconds: 3600
    # 带 Origin 的请求只允许这里列出的宿主 origin；服务端客户端通常不带 Origin。
    allowed_origins: []

# location_search、tool_a 与 tool_b 共用有界 worker；排队时间不计入执行超时。
tool_execution:
  max_workers: 2
  # 0 表示 worker 全忙时不排队，直接返回 busy。
  max_queue_length: 12
  # 单次取得 worker 后的总预算，覆盖 Python、整理、截图、写盘与发布。
  timeout_seconds: 300

# RAM Session 生命周期和 sessions.json 低频 checkpoint。
session:
  ttl_seconds: 86400
  expiry_check_interval_seconds: 1800
  flush_interval_seconds: 60
  # Node timer 单次 delay 的部署上限；更长的检查间隔按该值封顶。
  max_timer_delay_ms: 2147483647

# Headless Snapshot 执行器的全局资源边界；deviceScaleFactor 固定为 1，不配置。
snapshot:
  # 完整 MapSurface + Reference UI wrapper 的最大物理像素数。
  max_wrapper_physical_pixels: 64000000
