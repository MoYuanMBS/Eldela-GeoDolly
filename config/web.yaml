# GeoMCP 共享 HTTP service 部署配置。
# 当前只启用 Browser warning 专用通道；Map/session/snapshot service 尚未在此预留空配置。
http:
  # 内部 listener 共用 host；正式部署可以替换为容器或服务网络中的绑定地址。
  listen_host: "127.0.0.1"
  warning:
    # Browser 固定同源 POST /browser-warnings，由部署层转发到此内部端口。
    port: 8787
    # 单条 warning payload 很小；解析 JSON 前先限制累计请求体字节数。
    max_body_bytes: 4096
    # 所有 Interactive sessions 共用该通道；限流只保护服务，不替代 Browser 页面内去重。
    rate_limit_window_seconds: 60
    max_requests_per_window: 600
