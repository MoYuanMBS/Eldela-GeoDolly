# GeoMCP HTTP、Tool 调度、Session 与 Snapshot 部署配置。
http:
  # MCP/地图公开入口与独立 warning service 的监听地址；远程访问时按部署调整。
  listen_host: "127.0.0.1"
  # Node 固定监听 HTTP；公开 HTTPS 由隧道或反向代理终止。
  listen_protocol: "http"
  warning:
    # Browser 固定同源 POST /browser-warnings，由部署层转发到此内部端口。
    port: 23446
    # 单条 warning payload 很小；解析 JSON 前先限制累计请求体字节数。
    max_body_bytes: 4096
    # 所有 Interactive sessions 共用该通道；限流只保护服务，不替代 Browser 页面内去重。
    rate_limit_window_seconds: 60
    max_requests_per_window: 600
  map:
    # MCP、正式 Session、Snapshot、assets、front 字体与 basemap 共用此本机端口。
    port: 23336
    # IP/localhost 使用 HTTP，域名使用 HTTPS；可写 example.moe/mcp 并保留 /mcp 前缀。
    # 无路径时 MCP 入口为 /mcp；有路径时该路径本身就是 MCP 入口。
    # 直连部署时这里的公开端口应与上方 port 一致；隧道 HTTPS 地址可使用外部 443。
    # 使用隧道时填部署层提供的 HTTPS 域名，不绑定某个服务商；修改后需重建 App。
    public_origin: "http://127.0.0.1:23336"
  tls:
    # 兼容旧部署配置保留；HTTP-only Node 不读取证书文件。
    cert_file: "config/key/fullchain.pem"
    key_file: "config/key/privkey.pem"

# location_search、tool_a 与 tool_b 共用有界 worker；排队时间不计入执行超时。
tool_execution:
  max_workers: 2
  # 0 表示 worker 全忙时不排队，直接返回 busy。
  max_queue_length: 12
  # 单次取得 worker 后的总预算，覆盖 Python、整理、截图、写盘与发布。
  timeout_seconds: 300

# RAM Session 生命周期和 sessions.json 低频 checkpoint。
session:
  ttl_seconds: 86400
  expiry_check_interval_seconds: 1800
  flush_interval_seconds: 60
  # Node timer 单次 delay 的部署上限；更长的检查间隔按该值封顶。
  max_timer_delay_ms: 2147483647

# Server 截图的资源与编码预算，不改变地图逻辑尺寸。
snapshot:
  # 完整 MapSurface + Reference UI wrapper 的最大物理像素数。
  max_wrapper_physical_pixels: 64000000
  # 最终 WebP 二进制不超过 20 MiB。
  max_image_bytes: 20971520
  # 首次编码后最多重试 3 次，再保留一次最长边 640px 的最终兜底。
  max_encode_retries: 3
