# GeoMCP AI Output 清理规则
# 当前权威来源: doc/GeoMCP 技术规范文档.md

# 无条件从 AI Output tags 中删除命中的 tag。
remove_tags:
  - note=*
  - description=*
  - fixme=*
  - created_by=*
  - image=*
  - symbol=*
  - attribution=*
  - public_transport:version=*
  - url=*
  - phone=*
  - menu=*
  - fax=*
  - email=*

# 按完整 tag key 正则匹配，同时清理 AI Output 与最终 Overlay properties。
remove_tag_key_patterns:
  - '^source(?::.*)?$'
  - '^contact:.*$'
  - '^geobase:.*$'
  - '^note(?::.*)?$'
  - '^fixme(?::.*)?$'
  - '^.*(?:^|[:_-])wiki.*$'
  - '^.*(?:^|[:_-])web.*$'
  - '^contact(:.*)?$'


# tag 清洗后、annotations 之前，如果普通 AI 对象的所有剩余 tags 都命中本列表，
# 则删除整个 AI Output 对象；含 = 的条目是 exact，不含 = 的条目是 tag key regex。
drop_if_only_tags:
  - building=yes
  - area=yes
  - type=multipolygon
  - '^addr:.*$'
