# 轻量全局配置。
# 当前权威来源: doc/GeoMCP 技术规范文档.md

# MCP tool 对外文案。
# 主要供 TypeScript 在注册 `location_search` / `tool_a` / `tool_b` 时读取。
prompts:
  location_search:
    # 工具标题，显示给 MCP client / AI。
    title: "Location Search"
    # 工具说明文案。
    # 建议保持英文，避免影响不同 AI / MCP client 的理解。
    description: >
      Search and shortlist a location candidate before any heavy analysis.
      Call this tool first.
  tool_a:
    # Tool A 的展示标题。
    title: "Road And Traffic Analysis"
    # Tool A 的说明文案。
    description: >
      Heavy road and traffic analysis.
      Call location_search first, then pass the confirmed session and selection.
  tool_b:
    # Tool B 的展示标题。
    title: "Area And Facility Analysis"
    # Tool B 的说明文案。
    description: >
      Heavy area and facility analysis.
      Call location_search first, then pass the confirmed session and selection.

# Nominatim 运行参数。
# 主要供 Python 侧 `nominatim.py` 使用。
nominatim:
  # 单次搜索返回的最大候选数量。
  # 调大可能增加 AI 的选择负担；调小可能漏掉候选。
  location_limit: 30
  # 发给 Nominatim 的 User-Agent。
  # 部署时建议替换为正式服务标识，避免长期使用测试值。
  user_agent: "geomcp/test"
  # Nominatim HTTP 请求超时秒数。
  # 超时后会进入上游 HTTP 错误处理流程。
  timeout_seconds: 30.00

# Overpass 运行参数。
overpass:
  # Core expert-hit 对象向上反查 parent relation 的递归深度。
  relation_parent_depth: 1
  # Overlay relation member relation 的向下递归深度；0 只读取根 members，"all" 递归到没有新 relation。
  relation_member_depth: 2
  # Overlay 二阶段单批 skel 查询的 ID 数量；同时作为 area way 无 bbox 补抓的单次 ID 总上限。
  overlay_skel_id_batch_size: 1000
  # Overlay 二阶段 skel 批次最大并发数；默认 1，调高时仍会按 batch delay 错开请求启动。
  overlay_skel_concurrency: 1
  # Overlay 二阶段 skel 批次请求启动间隔秒数；降低公共服务限流概率。
  overlay_skel_batch_delay_seconds: 3.00
  # Overpass API 请求地址。
  endpoint: "https://overpass-api.de/api/interpreter"
  # 可选 Overpass API 请求地址池；为空时只使用 endpoint。
  endpoints:
    - "https://overpass.openstreetmap.fr/api/interpreter"
    - "https://overpass-api.de/api/interpreter"
    - "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
    - "https://lz4.overpass-api.de/api/interpreter"
  # endpoint 地址池策略：failover 优先单服务并在失败后切换；round_robin 每个请求轮流选择服务。
  endpoint_strategy: "failover"
  # 发给 Overpass API 的 User-Agent。
  user_agent: "geomcp/test"
  # Overpass Query 与 HTTP 请求共用的超时秒数。
  timeout_seconds: 60
  # 请求失败后的重试次数。
  retry_attempts: 3
  # 每次重试前的基础等待秒数。
  retry_delay_seconds: 5.00

# Geometry 模块统一运行参数；字段名明确标注各自单位。
geometry:
  # LineString / MultiLineString 投影到本地米制 CRS 后的 buffer 距离。
  line_buffer_meter: 50.00
  # Tool A 查询 bbox 的扩展距离，调用 geometry 前转换为米。
  tool_a_bbox_expand_km: 0.75
  # Tool B tile bbox 的扩展距离，调用 geometry 前转换为米。
  tool_b_bbox_expand_km: 0.75

  # --- Compression 运行参数 ---
  # tolerance 预测公式内部的算法调参常量仍定义在 compression.py 文件头。
  # coverage_simplify 的 tolerance 下界与上界，单位为米。
  base_tolerance_meter: 10.00
  max_tolerance_meter: 200.00
  # 全部 exterior open-ring 节点数的最终硬上限。
  max_node: 150
  # 初始预测失败后的最大反馈修正次数。
  max_retry: 3
  # --- Tool 面积限制 ---
  # 配置单位为 km²；面积模块内部统一换算为 m²。
  # Tool A 是 Tool B 超限后的宽松内部查询模式。
  tool_a_max_area_km2: 180.00
  tool_b_max_area_km2: 150.00
  # Overpass core polygon 的独立面积上限，不与最终 tile bbox 面积共用。
  max_core_area_km2: 120.00

# Feature ID 的共享生成与显示配置。
# Python 生成 node / way / area / relation Feature ID；TypeScript 处理 display ID。
feature_id:
  # canonical ID 使用的有序字母池，同时决定 render skin 的逐字符映射顺序。
  alphabet_pool: "DFHJPWXYKC"
  # 各类型使用独立命名空间，不做跨类型查重。
  id_scheme:
    node: {template: "{num}", mode: global}
    way: {template: "{alpha}{num}", mode: grouped, group: 20}
    area: {template: "{num}{alpha}", mode: global}
    relation: {template: "{alpha}-{num}", mode: round}
  # 全部使用 canonical 字符时设为 default_skin；未配置 active_skins 时也使用该默认值。
  # 启用 skin 时改为 mapping，alphabet / digits 可独立选择，缺少的一项仍使用 default_skin：
  # active_skins:
  #   alphabet: ganzhi
  #   digits: chinese
  render:
    active_skins: default_skin
    # skins 整体以及 alphabet / digits 子项均可选，只登记实际需要的 skin。
    skins:
      alphabet:
        ganzhi: "甲乙丙丁庚辛壬癸子丑"
      digits:
        chinese: "〇一二三四五六七八九"

# iframe 自适应的 Python / TypeScript 共享配置。
# 两端只读取并校验各自需要的字段，不解释另一端的专用参数。
iframe_adaptive:

# --- Python 内容复杂度与面积倍率参数 ---
  # 单个最终 node Feature 对内容复杂度的贡献权重。
  node_weight: 1.0
  # 单个最终 way Feature 对内容复杂度的贡献权重。
  way_weight: 0.8
  # 单个最终 area 计数单位的贡献权重；不展开或统计 area 内部元素。
  area_weight: 1.0
  # 单个最终 relation 记录对内容复杂度的贡献权重。
  relation_weight: 0.6
  # 最终合成中次驱动超过基准倍率 1.0 的贡献比例。
  secondary_factor_weight: 0.25
  # 内容分支与最终推荐倍率共用的上限。
  max_area_factor: 4.0

# --- TypeScript ScreenshotSpec 与 iframe 参数 ---
  # 纯地图 MapSurface 的逻辑尺寸范围；不包含 attribution footer。
  min_screenshot_width: 800
  max_screenshot_width: 1600
  min_screenshot_height: 500
  max_screenshot_height: 1000
  # 逻辑像素安全预算；与当前最大面积倍率下的参考面积一致。
  max_screenshot_pixels: 1600000
  # recommended_viewport_area_factor=1 时的参考逻辑面积。
  reference_screenshot_area: 400000
  # 截图画布允许使用的极端宽高比范围。
  min_aspect_ratio: 0.8
  max_aspect_ratio: 3.2
  # Leaflet 初始视口为 bbox 四周预留的对称安全距离。
  padding:
    top: 32
    right: 32
    bottom: 32
    left: 32
  # MapSurface 缩放后的最小可读尺寸。
  # 最低 iframe 高度由 min_map_display_height + padding.bottom + 内置 Toolbar 最小高度得到。
  min_map_display_width: 600
  min_map_display_height: 300

# Browser Map Flow 等待初始瓦片与视觉子流程完成的统一上限。
browser_map:
  ready_timeout_seconds: 30

# Leaflet 地图视口与 Overlay renderer 的可公开调节参数。
# 这些值由 TypeScript 在进程启动时校验，并随每次地图 payload 传给浏览器；浏览器不直接读取 YAML。
leaflet:
  # 地图视觉 zoom 上限；独立于底图 profile 的 max_native_zoom，高层级允许放大原生瓦片。
  viewport:
    max_zoom: 24

  # 单个类型连续渲染多少个 Feature 后，主动把执行权归还一次浏览器事件循环。
  # 值越小，批量加载期间 UI 越容易响应，但调度次数会增加；单位为 Feature 数量，必须为正整数。
  render_batch_size: 200

  # Node 圆点使用屏幕逻辑像素半径，不会像地理距离那样自动随地图缩放，因此在这里分级显隐/缩放。
  # 三个 zoom 边界必须严格递增；两个 scale 必须大于 0、不得超过 1，且 compact_scale <= medium_scale。
  node_zoom:
    # zoom <= 此值时完全移除 Node Feature group；视觉圆、标签和透明命中层都会隐藏。
    hidden_max_zoom: 13
    # hidden_max_zoom < zoom <= 此值时使用 compact_scale。
    compact_max_zoom: 15
    # 低 zoom 紧凑档的半径倍率；例如 0.55 表示原样式半径的 55%。
    compact_scale: 0.55
    # compact_max_zoom < zoom <= 此值时使用 medium_scale；更高 zoom 恢复 1.0 原始半径。
    medium_max_zoom: 17
    # 中 zoom 档的半径倍率；只缩放可见 Node 圆，不缩放额外的指针容错像素。
    medium_scale: 0.8

  # Relation 仅追加固定半透明 Canvas membership，不接受用户 CSS/rule 覆盖。
  # 以下尺寸均为屏幕逻辑像素，并受 visual_limits 的 Canvas 上限约束。
  relation_membership:
    # Relation Node 外圈的中心线半径，不包含描边向外扩展的半宽。
    node_radius_px: 8
    # Relation Node 外圈的描边宽度。
    node_stroke_width_px: 2.5
    # Relation Way 半透明覆盖线的完整宽度。
    way_width_px: 4
    # Relation Area 沿 Polygon 边界向内裁切后的总带宽；Area 主色需要分带时会占其中一半。
    area_band_total_width_px: 12

  # 透明命中层只为至少存在一种可见 fill/stroke/Relation 绘制的 Feature 创建命中区域。
  # Node/Way 先按全部实际可见绘制的最外尺寸计算，再增加容错并钳制到对应 min/max。
  interaction:
    # Node 命中半径在视觉最外半径之外额外增加的逻辑像素。
    node_extra_radius_px: 2
    # Way 命中线宽在视觉最宽线条之外额外增加的逻辑像素。
    way_extra_width_px: 4
    # Area 透明命中 Polygon 的边缘线宽；Area 内部仍按完整 even-odd 填充区域命中。
    area_edge_width_px: 8
    # 可见 Node 的最小命中半径；不会让完全不可见的 Node 恢复交互。
    min_node_radius_px: 8
    # Node 命中半径硬上限，用于限制超大 CSS/Canvas 图形造成的邻近误选。
    max_node_radius_px: 24
    # 可见 Way 的最小命中线宽；不会让 stroke:none 或透明 Way 恢复交互。
    min_way_width_px: 10
    # Way 命中线宽硬上限，用于限制宽线对周边对象的遮挡。
    max_way_width_px: 32
    # Area 边缘命中线宽硬上限；area_edge_width_px 不得超过此值。
    max_area_edge_width_px: 20

  # 地图视觉尺寸的安全边界。Canvas recipe/Relation 超出上限会在初始化或配置校验时失败；
  # 用户 CSS 超出上限只记录 warning，视觉保持用户值，但透明命中层仍受 interaction 的 max 值钳制。
  visual_limits:
    # 单个 Canvas Node operation 或 Relation Node 允许的最大中心线半径，单位为逻辑像素。
    max_canvas_node_radius_px: 20
    # Canvas/Relation 任意 stroke 允许的最大线宽，单位为逻辑像素。
    max_canvas_stroke_width_px: 24
