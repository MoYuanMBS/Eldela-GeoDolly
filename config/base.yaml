# GeoMCP base Overpass rules
# 当前权威来源: doc/GeoMCP 技术规范文档.md

context:
  name: "context"
  hints:
    - "Tool A 与 Outer/context 共用的默认基础查询规则"

  overpass_tags:
    - highway~=^(motorway|trunk|primary|secondary)(_link)?$
    - railway~=^(rail|station)$
    - landuse=*

  overlay_rules:
    - match: "highway~=^(motorway|trunk|primary|secondary)(_link)?$"
    - match: "railway~=^(rail|station)$"

  tag_annotations: []
