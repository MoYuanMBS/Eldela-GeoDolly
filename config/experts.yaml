# GeoMCP experts configuration
# 当前权威来源: doc/GeoMCP 技术规范文档.md

example_expert:
  name: "example_expert"
  hints:
    - "osm_tag = value 表示含义"
    - "example_tag = example_value 示例"

  overpass_tags:
    - osm_tag=*
    - example_tag=example_value

  overlay_rules:
    - match: "osm_tag=*"
    - match: "example_tag=example_value"

  tag_annotations:
    - match: "example_tag=example_value"
      annotation: "示例专家 tag"
