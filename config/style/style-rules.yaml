rules:
  - id: node-airport
    kind: css
    renderLayer: base
    featureType: node
    priority: 160
    key: aeroway
    value: aerodrome
    className: geomcp-user-node-airport
    nodeIcon:
      asset: icon/airport.svg
      sizePx: 16

  - id: node-rail-station
    kind: css
    renderLayer: base
    featureType: node
    priority: 145
    key: railway
    value:
      regex: "^(station|halt|tram_stop)$"
    className: geomcp-user-node-rail-station
    nodeIcon:
      asset: icon/train-station.svg
      sizePx: 16

  - id: user-amenity-node
    kind: css
    renderLayer: base
    featureType: node
    priority: 100
    key: amenity
    value:
      regex: ".+"
    className: geomcp-user-amenity-node

  - id: user-primary-road
    kind: css
    renderLayer: base
    featureType: way
    priority: 100
    key: highway
    value:
      regex: "^(primary|primary_link)$"
    className: geomcp-user-primary-road

  - id: user-building-area
    kind: css
    renderLayer: base
    featureType: area
    priority: 100
    key: building
    value:
      regex: "^(?!no$).+"
    className: geomcp-user-building-area
